name: Render Fortnite Short (Remotion)
on:
  workflow_dispatch:
  push:
    paths:
      - 'fortnite-shorts/**'
      - '.github/workflows/fortnite-remotion.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fortnite-shorts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for Remotion
        run: npx remotion browser ensure
      - name: Render MP4
        run: npm run render
      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: fortnite-short-preview
          path: fortnite-shorts/out/fortnite-tips.mp4
          if-no-files-found: error
          retention-days: 7
